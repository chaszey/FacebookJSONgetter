name: Schaakhuis Facebook Sync

on:
  schedule:
    - cron: '0 8-23/2 * * *' # Elke 2 uur tussen 08:00 en 23:00 uur
  workflow_dispatch: # Zodat je hem ook handmatig kunt testen in GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests apify-client

      - name: Run script
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }} # Vergeet niet ook je Apify token toe te voegen als Secret!
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASS: ${{ secrets.WordpressPassword }} # Komt overeen met jouw secret naam
        run: python scraper.py
