name: Schaakhuis Facebook Sync

on:
  workflow_dispatch: # Zodat je handmatig op de knop kunt drukken
  schedule:
    - cron: '0 */6 * * *' # Draait optioneel elke 6 uur automatisch

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests apify-client

      - name: Run script
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASS: ${{ secrets.WP_PASS }}
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
        run: python scraper.py
