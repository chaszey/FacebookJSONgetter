name: Schaakhuis Facebook Sync

on:
  workflow_dispatch: # Zodat je handmatig op de knop kunt drukken
    inputs:
      dry_run:
        description: 'Dry run (niets plaatsen, alleen LLM-beoordeling tonen)'
        type: boolean
        default: false
  # schedule:
  #   - cron: '17 10,13,16 * * 6'  # zaterdag: 12:17, 15:17, 18:17 (NL zomertijd)
  #   - cron: '17 16 * * 0'        # zondag: 18:17

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests apify-client

      - name: Run script
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASS: ${{ secrets.WORDPRESSPASSWORD }}
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
          FB_PROXY_URL: ${{ secrets.FB_PROXY_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python scraper.py
